# Render.com Blueprint — deploys the FastAPI backend.
# In Render: New -> Blueprint -> point to your repo. Then set the SECRET env vars
# (MONGO_URL + at least OPENROUTER_API_KEY) in the dashboard.
services:
  - type: web
    name: interview-ai-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DB_NAME
        value: interview_ai
      # Chain: OpenRouter FREE -> OpenRouter paid -> Anthropic (last resort).
      - key: OPENROUTER_FREE_MODEL
        value: openrouter/free
      - key: OPENROUTER_MODEL
        value: deepseek/deepseek-chat
      # Used automatically ONLY when images are attached (hybrid cost control).
      - key: OPENROUTER_VISION_MODEL
        value: openai/gpt-4o-mini
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-6
      - key: APP_TITLE
        value: Interview AI Engine
      - key: CORS_ORIGINS
        value: "*"
      # Set these as SECRETS in the Render dashboard (do not commit real values).
      # OPENROUTER_API_KEY is the recommended primary. The others are optional.
      - key: MONGO_URL
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      # Shared password that gates MANUAL Server-mode selection in the UI.
      - key: SERVER_ACCESS_PASSWORD
        sync: false
      # Password protecting /admin (if unset, /admin is inaccessible).
      - key: ADMIN_PASSWORD
        sync: false
      # CareerOS member accounts: long random secret signing JWT tokens (REQUIRED).
      - key: JWT_SECRET
        generateValue: true
      # CareerOS Radar — Jooble = main source; Adzuna optional (paid plan), ignored when empty
      - key: JOOBLE_API_KEY
        sync: false
      # Cost control: rules pre-scoring for every offer, AI only for the best RADAR_AI_TOP per day (+ on-demand)
      - key: RADAR_AI_TOP
        value: "5"
      - key: RADAR_DEEP_LIMIT
        value: "20"
      # Model routing: economical model for analyses, premium only for letters + interview simulations
      - key: OPENROUTER_PREMIUM_MODEL
        value: "~google/gemini-pro-latest"
      # Gemini (Google AI Studio, free tier) = first provider for analyses
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_SERVER_MODEL
        value: gemini-flash-latest
      # Low-credit alert e-mail (Emergent managed e-mail)
      - key: EMERGENT_EMAIL_KEY
        sync: false
      - key: EMAIL_FROM_NAME
        value: CareerOS
      - key: ADZUNA_APP_ID
        sync: false
      - key: ADZUNA_APP_KEY
        sync: false
      - key: RADAR_DAILY_LIMIT
        value: "50"
      - key: RADAR_CRON_SECRET
        generateValue: true
      - key: ADMIN_RETENTION_DAYS
        value: "90"
