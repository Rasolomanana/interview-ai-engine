# Render.com Blueprint — deploys the FastAPI backend.
# In Render: New -> Blueprint -> point to your repo. Then set the SECRET env vars
# (MONGO_URL + at least OPENROUTER_API_KEY) in the dashboard.
services:
  - type: web
    name: interview-ai-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DB_NAME
        value: interview_ai
      # Cheapest-first provider. "provider/model" from https://openrouter.ai/models
      - key: OPENROUTER_MODEL
        value: deepseek/deepseek-chat
      # Used automatically ONLY when images are attached (hybrid cost control).
      - key: OPENROUTER_VISION_MODEL
        value: openai/gpt-4o-mini
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-6
      - key: OPENAI_MODEL
        value: gpt-4o
      - key: APP_TITLE
        value: Interview AI Engine
      - key: CORS_ORIGINS
        value: "*"
      # Set these as SECRETS in the Render dashboard (do not commit real values).
      # OPENROUTER_API_KEY is the recommended primary. The others are optional.
      - key: MONGO_URL
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      # Shared password that gates MANUAL Server-mode selection in the UI.
      - key: SERVER_ACCESS_PASSWORD
        sync: false
      # Password protecting /admin (if unset, /admin is inaccessible).
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_RETENTION_DAYS
        value: "90"
